<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>哪隻小狐比較可愛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
  /* Layout: a picture-book spread — two equal stages side by side (stacked on phones), feeling chips above, a big pick button under each */
  :root {
    --bg: #fff6ec;
    --paper: #ffffff;
    --ink: #4a2e2a;
    --soft: #8a6a60;
    --line: #f1dccb;
    --fox: #ef7d33;
    --sky: #d7ecfb;
    --grass: #a9db8c;
    --heart: #e8507a;
    --display: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
    --body: "Noto Sans TC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #231915; --paper: #2f231e; --ink: #fbeee3; --soft: #c9ab9c; --line: #47362e;
      --fox: #f59a57; --sky: #34475a; --grass: #4f7a45; --heart: #ff7d9f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #231915; --paper: #2f231e; --ink: #fbeee3; --soft: #c9ab9c; --line: #47362e;
    --fox: #f59a57; --sky: #34475a; --grass: #4f7a45; --heart: #ff7d9f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 32px;
  }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font-family: var(--display); font-weight: 900; font-size: clamp(26px, 5vw, 40px); margin: 0; text-wrap: balance; }
  h1 span { color: var(--fox); }
  .lead { margin: 4px 0 0; color: var(--soft); line-height: 1.6; }
  .moods { display: flex; flex-wrap: wrap; gap: 10px; }
  .moods button {
    font: 700 17px var(--body); padding: 10px 18px; border-radius: 999px; border: 2px solid var(--line);
    background: var(--paper); color: var(--ink); cursor: pointer; min-height: 48px;
  }
  .moods button[aria-pressed="true"] { background: var(--fox); border-color: var(--fox); color: #fff; }
  .moods button:focus-visible, .pick:focus-visible { outline: 3px solid var(--heart); outline-offset: 2px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .side { display: grid; gap: 10px; min-width: 0; }
  .tag { font-family: var(--display); font-weight: 600; font-size: 22px; display: flex; align-items: baseline; gap: 10px; }
  .tag small { font: 500 14px var(--body); color: var(--soft); }
  .stage {
    position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 22px; overflow: hidden;
    background: linear-gradient(var(--sky), var(--bg) 68%, var(--grass) 68%);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
  }
  .stage img { width: 100%; height: 100%; object-fit: contain; padding: 4% 14% 2%; user-select: none; -webkit-user-drag: none; }
  .stage img.still { width: 72%; height: auto; padding: 0; transform-origin: 50% 92%; animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.02, 0.98); } }
  #fox { position: relative; width: 72%; aspect-ratio: 1; margin-top: 6%; touch-action: none; cursor: grab; }
  #fox canvas.fox3d { position: absolute; left: -25%; top: -25%; width: 150%; height: 150%; pointer-events: none; }
  .loading { position: absolute; inset: auto 0 12px; text-align: center; color: var(--soft); font-size: 14px; }
  .pick {
    font: 900 20px var(--body); min-height: 56px; border-radius: 18px; border: 0; cursor: pointer;
    background: var(--heart); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--heart) 60%, #000);
  }
  .pick:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--heart) 60%, #000); }
  .count { text-align: center; color: var(--soft); font-variant-numeric: tabular-nums; min-height: 1.4em; }
  .burst { position: absolute; font-size: 44px; pointer-events: none; animation: float 1s ease-out forwards; }
  @keyframes float { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-120px) scale(1.2); opacity: 0; } }
  .result { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; line-height: 1.7; }
  .result strong { color: var(--fox); }
  details { color: var(--soft); line-height: 1.7; }
  details summary { cursor: pointer; }
  @media (max-width: 640px) { .duo { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .stage img, .burst { animation: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>哪隻<span>小狐</span>比較可愛？</h1>
    <p class="lead">先點上面的心情，看看兩隻小狐的樣子。覺得哪隻比較可愛，就按牠下面的按鈕。可以換不同心情多選幾次喔！</p>
  </header>

  <div class="moods" id="moods" role="group" aria-label="心情"></div>

  <div class="duo">
    <section class="side" aria-label="小狐 A">
      <div class="tag">小狐 A <small>插畫</small></div>
      <div class="stage" id="stageA"><img id="sprite" alt="小狐 A"></div>
      <button class="pick" id="pickA" type="button">我喜歡 A！</button>
      <div class="count" id="countA"></div>
    </section>
    <section class="side" aria-label="小狐 B">
      <div class="tag">小狐 B <small>可以用手指拖著轉</small></div>
      <div class="stage" id="stageB"><div id="fox" class="fox three"></div><div class="loading" id="loading">小狐 B 準備中…</div></div>
      <button class="pick" id="pickB" type="button">我喜歡 B！</button>
      <div class="count" id="countB"></div>
    </section>
  </div>

  <div class="result" id="result">還沒選喔。</div>

  <details>
    <summary>給大人看</summary>
    A 是 2D 插畫原圖用 Wan 2.2 生成的待機循環動畫（每種心情 24 格、每秒 16 格）；B 是 3D 模型，會看著手指、耳朵和尾巴會晃、有呼吸和表情演技。票數只存在這台裝置的瀏覽器裡。
  </details>
</div>

<script type="module">
// [mood, label, still sprite, Wan idle loop folder (24 frames at 16 fps)]
const MOODS = [
  ['normal', '平常', 'assets/fox/t1/normal.png', 'normal'],
  ['happy', '開心', 'assets/fox/t1/happy.png', 'happy'],
  ['love', '喜歡', 'assets/fox/t1/d04/pet_happy.png', 'pet_happy'],
  ['surprised', '驚訝', 'assets/fox/t1/surprised.png', 'surprised'],
  ['curious', '好奇', 'assets/fox/t1/puzzled.png', 'puzzled'],
  ['sad', '難過', 'assets/fox/t1/sulky.png', 'sulky'],
  ['angry', '生氣', 'assets/fox/t1/angry.png', 'angry'],
];
const FRAMES = 24, FPS = 16;
const loops = {}; // folder → preloaded frame images
let player = 0;
function loopFrames(folder) {
  if (!loops[folder]) loops[folder] = Array.from({ length: FRAMES }, (_, i) => {
    const im = new Image();
    im.src = `assets/fox/wan_idle/${folder}/frame_${String(i).padStart(2, '0')}.webp`;
    return im;
  });
  return loops[folder];
}
function playA(still, folder) {
  clearInterval(player);
  const img = $('sprite');
  const frames = loopFrames(folder);
  img.src = still;
  img.classList.add('still');
  let i = 0;
  player = setInterval(() => {
    const f = frames[i];
    if (f.complete && f.naturalWidth) { img.src = f.src; img.classList.remove('still'); }
    i = (i + 1) % FRAMES;
  }, 1000 / FPS);
}
const REPLAY = { surprised: 1, angry: 1, curious: 1 };
const $ = id => document.getElementById(id);
const votes = load();
let current = 'normal', replay = 0;

function load() {
  try { return JSON.parse(localStorage.getItem('fox-pick-votes')) || { A: 0, B: 0, by: {} }; } catch (e) { return { A: 0, B: 0, by: {} }; }
}
function save() { try { localStorage.setItem('fox-pick-votes', JSON.stringify(votes)); } catch (e) {} }

function showVotes() {
  $('countA').textContent = votes.A ? `已經選了 ${votes.A} 次` : '';
  $('countB').textContent = votes.B ? `已經選了 ${votes.B} 次` : '';
  const total = votes.A + votes.B;
  if (!total) { $('result').textContent = '還沒選喔。'; return; }
  const names = Object.fromEntries(MOODS.map(([k, n]) => [k, n]));
  const lines = Object.entries(votes.by).map(([k, v]) => `${names[k]}：${v}`).join('、');
  const lead = votes.A === votes.B ? '目前平手！' : `目前 <strong>小狐 ${votes.A > votes.B ? 'A' : 'B'}</strong> 比較受歡迎`;
  $('result').innerHTML = `${lead}（A ${votes.A} 票，B ${votes.B} 票）<br>各心情選的：${lines}`;
}

function vote(side) {
  votes[side]++;
  votes.by[current] = side;
  save();
  showVotes();
  const stage = $(side === 'A' ? 'stageA' : 'stageB');
  for (let i = 0; i < 5; i++) {
    const h = document.createElement('div');
    h.className = 'burst';
    h.textContent = '❤';
    h.style.color = 'var(--heart)';
    h.style.left = 20 + Math.random() * 60 + '%';
    h.style.top = 50 + Math.random() * 20 + '%';
    h.style.animationDelay = i * 0.08 + 's';
    stage.appendChild(h);
    setTimeout(() => h.remove(), 1400);
  }
}

function pick(name) {
  current = name;
  const [, , still, folder] = MOODS.find(m => m[0] === name);
  playA(still, folder);
  document.querySelectorAll('#moods button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === name)));
  if (window.Fox3D?.parts?.fox) {
    Fox3D.set({ mood: name, tails: 1 });
    Fox3D.perform(name === 'normal' ? null : name);
    clearInterval(replay);
    if (REPLAY[name]) replay = setInterval(() => Fox3D.perform(name), 2500);
  }
}

for (const [name, label] of MOODS) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.dataset.m = name;
  b.onclick = () => pick(name);
  $('moods').appendChild(b);
}
$('pickA').onclick = () => vote('A');
$('pickB').onclick = () => vote('B');
pick('normal');
showVotes();

try {
  await import('./fox3d.js');
  await Fox3D.ready;
  if (!Fox3D.parts.fox) throw new Error('model did not load');
  $('loading').hidden = true;
  pick(current);
} catch (e) {
  console.error('fox B', e);
  $('loading').textContent = '小狐 B 載入失敗，請重新整理頁面';
}
</script>

</body>
</html>
